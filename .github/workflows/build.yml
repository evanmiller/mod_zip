name: build
on: [ push, pull_request ]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ static, dynamic ]
        compiler: [ gcc, clang ]
        version:
          # HTTP/3 support starts with nginx 1.25.0.
          - number: 1.22.1
            http3: false
          - number: 1.24.0
            http3: false
          - number: 1.26.3
            http3: true
          - number: 1.28.0
            http3: true
          - number: 1.29.1
            http3: true
    steps:
      # Prepare environment
      - name: Install carton
        run: sudo apt install carton libssl-dev
      - uses: actions/checkout@v2
      - name: Download nginx
        run: wget http://nginx.org/download/nginx-${{ matrix.version.number }}.tar.gz
      - name: Untar nginx
        run: tar xvfz nginx-${{ matrix.version.number }}.tar.gz

      # Configure nginx with static mod_zip
      - name: Configure (static)
        if: ${{ matrix.mode == 'static' }}
        run: >-
          ./configure --prefix="${GITHUB_WORKSPACE}/t/nginx"
          --add-module="${GITHUB_WORKSPACE}"
          ${{ matrix.version.http3 && '--with-http_v3_module' || '' }}
        working-directory: nginx-${{ matrix.version.number }}
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -Wno-implicit-fallthrough

      # Configure nginx without modules
      - name: Configure (nginx only)
        if: ${{ matrix.mode == 'dynamic' }}
        run: >-
          ./configure --prefix="${GITHUB_WORKSPACE}/t/nginx"
          ${{ matrix.version.http3 && '--with-http_v3_module' || '' }}
        working-directory: nginx-${{ matrix.version.number }}
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -Wno-implicit-fallthrough

      # Both paths require nginx to be compiled and installed
      - name: Make
        run: make -j${nproc}
        working-directory: nginx-${{ matrix.version.number }}
      - name: Make install
        run: make install
        working-directory: nginx-${{ matrix.version.number }}

      # mod_zip dynamic module
      - name: Configure (mod_zip dynamic)
        if: ${{ matrix.mode == 'dynamic' }}
        run: >-
          ./configure --prefix="${GITHUB_WORKSPACE}/t/nginx"
          --add-dynamic-module="${GITHUB_WORKSPACE}"
          ${{ matrix.version.http3 && '--with-http_v3_module' || '' }}
        working-directory: nginx-${{ matrix.version.number }}
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -Wno-implicit-fallthrough
      - name: Make modules
        run: make -j${nproc} modules
        if: ${{ matrix.mode == 'dynamic' }}
        working-directory: nginx-${{ matrix.version.number }}
      - name: Add load_module to nginx.conf
        if: ${{ matrix.mode == 'dynamic' }}
        run: sed -i "1iload_module ${GITHUB_WORKSPACE}/nginx-${{ matrix.version.number }}/objs/ngx_http_zip_module.so;" ${GITHUB_WORKSPACE}/t/nginx.conf

      # Run test harness
      - name: Start nginx
        run: ./restart.sh
        working-directory: t
      - name: Carton install
        run: carton install
        working-directory: t
      - name: Carton exec
        run: carton exec ./ziptest.pl
        working-directory: t
